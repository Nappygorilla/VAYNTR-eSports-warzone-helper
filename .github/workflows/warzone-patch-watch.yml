name: Warzone patch notes watcher

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-official-patch-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changes to official Call of Duty patch notes
        id: patchcheck
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.callofduty.com/patchnotes"
          curl --fail --location --silent --show-error "$URL" -o /tmp/cod-patch-notes.html
          CURRENT="$(sha256sum /tmp/cod-patch-notes.html | cut -d ' ' -f 1)"
          FILE=".github/warzone-patch-page.sha256"
          PREVIOUS="$(cat "$FILE" 2>/dev/null || echo INITIAL_BASELINE)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$PREVIOUS" = "INITIAL_BASELINE" ]; then
            echo "$CURRENT" > "$FILE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Initialized official patch-notes fingerprint."
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "$CURRENT" > "$FILE"
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          path = "data/warzone-status.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["status"] = "review-required"
          data["detectedAt"] = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          data["message"] = "The official Call of Duty patch-notes index changed. Review the latest Warzone notes before treating this settings baseline as current."
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\\n")
          PY
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Official patch-notes index changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No official page change detected."
          fi

      - name: Open review issue when official notes change
        if: steps.patchcheck.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_URL: ${{ steps.patchcheck.outputs.url }}
          PATCH_HASH: ${{ steps.patchcheck.outputs.current }}
        run: |
          gh issue create \
            --title "Review VAYNTR Warzone settings after official update" \
            --body "The official Call of Duty patch-notes index changed. Review the latest Warzone notes and verify whether general display, input, audio, or network recommendations need changes. Do not change settings merely because the page changed.\n\nOfficial notes: $PATCH_URL\n\nPage fingerprint: $PATCH_HASH"

      - name: Commit changed patch status
        if: steps.patchcheck.outputs.changed == 'true' || steps.patchcheck.outputs.changed == 'false'
        shell: bash
        run: |
          if git diff --quiet -- .github/warzone-patch-page.sha256 data/warzone-status.json; then
            echo "Patch status files unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/warzone-patch-page.sha256 data/warzone-status.json
          git commit -m "Track official patch notes status"
          git push
